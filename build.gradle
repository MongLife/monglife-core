
plugins {
    id 'java-library'
}

apply plugin: 'java-library'

dependencies {
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
}

repositories {
    mavenCentral()
}

ext {
    coreVersion ='2.0.3'

}

jar {
    archiveVersion.set("${coreVersion}")
    destinationDirectory.set(file("./release"))
    enabled(true)
}